# Basic activation (string format for backward compatibility)
model_params:
  # ...
  activation: "gelu"

# Basic activation with parameters
model_params:
  # ...
  activation:
    type: "leaky_relu"
    negative_slope: 0.2
    inplace: true

# Sequential activation
model_params:
  # ...
  activation:
    type: "sequential"
    activations:
      - type: "relu"
        inplace: true
      - type: "tanh"

# Weighted sum activation
model_params:
  # ...
  activation:
    type: "weighted_sum" 
    activations:
      - "relu"
      - "swish"
      - "mish"
    initial_weights: [0.5, 0.3, 0.2]  # Optional

# Custom gated activation (e.g., create Swish manually)
model_params:
  # ...
  activation:
    type: "gated"
    main_activation: "identity"
    gate_activation: "sigmoid"

# Complex parameterized activation
model_params:
  # ...
  activation:
    type: "adaptive"
    num_channels: 64  # Must match width/hidden_channels
