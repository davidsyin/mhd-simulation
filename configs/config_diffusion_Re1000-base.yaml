config_type: "diffusion"

####################
## Model options
model_params:
  model_type: "elucidated"  # "elucidated" or "unet"
  
  # UNet parameters
  base_dim: 128
  dim_mults: [1, 2, 3, 6]
  channels: 2  # Updated to match the number of selected channels [0, 2]
  self_condition: True
  learned_variance: False
  learned_sinusoidal_cond: False
  random_fourier_features: False
  sinusoidal_pos_emb_theta: 10000
  learned_sinusoidal_dim: 16
  dropout: 0.0
  
  # Attention parameters
  attn_heads: 4  # Can be a list for different layers
  attn_dim_head: 32  # Can be a list for different layers
  flash_attn: True
  
  # ElucidatedDiffusion parameters
  image_size: 128
  num_sample_steps: 32
  sigma_min: 0.002
  sigma_max: 80
  sigma_data: 0.5
  rho: 7
  P_mean: -1.2
  P_std: 1.2
  S_churn: 80
  S_tmin: 0.05
  S_tmax: 50
  S_noise: 1.003

###################
## Normalization options at dataset level
normalization_params:
  type: "physics"
  # input_norm: [1.0, 1.0, 2.5e-4]
  # output_norm: [1.0, 1.0, 2.5e-4]
  input_norm: [0.01753213788944436, 0.0007779530682822583]
  output_norm: [0.01753213788944436, 0.0007779530682822583]

###################
## Dataset options
dataset_params:
  train_path: "data/diffusion/psiA_Re1000/train.npy"
  val_path: "data/diffusion/psiA_Re1000/val.npy"
  test_path: "data/diffusion/psiA_Re1000/test.npy"
  # channel_indices: 2    # Can be a list of channel indices

###################
## Dataloader options
train_loader_params:
  batch_size: 32
  shuffle: True
  num_workers: 1
  pin_memory: True

###################
## Optimizer options
optimizer_params:
  optimizer_type: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

  use_scheduler: True
  scheduler_type: "cosine"
  T_max: 1000
  eta_min: 5.0e-5

###################
## Training params
train_params:
  epochs: 1000
  ckpt_path: "model_checkpoints/diffusion_base_Re1000.pt" # Rexxxx_basedim_len(dim_mults)_attnheads_attndimhead_batchsize_numsamplesteps
  load_ckpt: "model_checkpoints/diffusion_base_epoch0_Re1000.pt"  # Leave empty to start from scratch
  is_finetune: False
  val_interval: 2
  sample_interval: 100
  clip_grad: True
  clip_grad_max_norm: 1.0
  norm_torchvision: True
  denorm_enhanced_vis: True

###################
## Log params
log_dir: "model_checkpoints/diffusion_Re1000_base/"

###################
## wandb params -- optional (for consistency with neural operator config)
wandb_params:
  wandb_dir: "model_checkpoints/diffusion_Re1000_base/"
  wandb_project: "NODs_Diffusion"
  wandb_group: "Re1000"
  wandb_num_plots: 1
  wandb_plot_freq: 2
