####################
## Model options
model_params:
  model_type: "tfno_3d"
  # model_variant: "3d" # optional
  # width: 32 # hidden_channels in TFNO3d
  # modes1: 20 # x dimension modes
  # modes2: 20 # y dimension modes
  # modes3: 20 # t dimension modes
  # fc_dim: 256 # For lifting_channels and projection_channels
  # in_dim: 6
  # out_dim: 3
  in_channels: 5 # t, x, y, psi, A
  out_channels: 2 # psi, A
  decoder_layers: 1
  dimension: 3
  latent_channels: 24 # aka fno_layer_size and fno_width
  num_fno_layers: 3 # n_layers in TFNO3d
  num_fno_modes: 12
  # modes: [0, 20]
  padding: [5, 0, 0]
  padding_type: "constant"
  activation_fn: "gelu"
  coord_features: False
  # pad_x: 0.00 # padding ratio in x direction
  # pad_y: 0.00 # padding ratio in y direction
  # pad_z: 0.00 # padding ratio in t direction
  rank: 6481  # Tensor factorization rank (either a float in [0.0, 1.0] or an integer > 1)
  # factorization: "cp"
  # positional_embedding: False

###################
## Normalization options at dataset level
normalization_params:
  type: "physics"
  # input_norm: [1.0, 1.0, 2.5e-4]
  # output_norm: [1.0, 1.0, 2.5e-4]
  # input_norm: [0.01753213788944436, 0.0007779530682822583]
  # output_norm: [0.01753213788944436, 0.0007779530682822583]
  input_norm: [0.021676693253362907, 0.0009384952345804561]
  output_norm: [0.021676693253362907, 0.0009384952345804561]
  # stats_file: "/u/skacmaz/NODs/stats/train_only_stats.npz"
  #
  # type: "minmax"
  # feature_range: [-1, 1]

  # type: "standard"
  # # mean: [0.0, 0.0, 0.0] # Uncomment if you want to use your own stats
  # # std: [1.13536170e-01, 1.04062743e-01, 6.62853878e-05] # Uncomment if you want to use your own stats

###################
## Dataset options
dataset_params:
  data_dir : "data/"
  data_file : "data_test_Re750.npy"
  # data_dir: "/work/hdd/begd/skacmaz/NODs_mhd_data_Re100/"
  # data_file: "mhd_data_3channel_Re100.npy"
  name: "MHD_TFNO3d"
  train_size: 360
  val_plus_test_size: 40
  seed: 42
  sub_t: 1 # Subsampling factor for time dimension
  sub_x: 1 # Subsampling factor for spatial dimensions

###################
## Loss options
loss_params:
  type: "physics-informed"
  # reduction: "mean"
  nu: 0.00133333333333
  eta: 0.00133333333333
  rho0: 1.0

  data_weight: 5.0
  ic_weight: 1.0
  pde_weight: 0.05
  constraint_weight: 10.0

  use_data_loss: True
  use_ic_loss: True
  use_pde_loss: True
  use_constraint_loss: False # Redundant with stream function and vector potential

  u_weight: 2.0
  v_weight: 1.0
  A_weight: 1.0

  Du_weight: 1.0
  Dv_weight: 1.0
  DA_weight: 1.0

  div_B_weight: 1.0
  div_vel_weight: 1.0

  Lx: 1.0
  Ly: 1.0
  tend: 1.0

  use_weighted_mean: False


# loss_params:
#   type: "mse"
#   reduction: "mean"
#
# # Or a more complex example:
# loss_params:
#   type: "weighted_mse"
#   weights: [1.0, 2.0, 0.5]  # Higher weight on second component
#   reduction: "mean"
#
# # Physics-informed example:
# loss_params:
#   type: "physics_informed"
#   data_loss_type: "mse"
#   data_loss_weight: 1.0
#   physics_loss_weight: 0.5

###################
## Dataloader options
train_loader_params:
  batch_size: 1
  shuffle: True
  num_workers: 1
  pin_memory: True

val_loader_params:
  batch_size: 1
  shuffle: False
  num_workers: 1
  pin_memory: False

test_loader_params:
  batch_size: 1
  shuffle: False
  num_workers: 1
  pin_memory: False

###################
## Optimizer options
optimizer_params:
  optimizer_type: "adamw" # options: adam, adamw, sgd, lbfgs, lion, radam, adabelief, etc.
  lr: 1.0e-4
  weight_decay: 5.0e-4
  betas: [0.9, 0.999]

  use_scheduler: True
  scheduler_type: "reducelr" # options: multistep, cosine, reducelr, dummy
  mode: "min"
  factor: 0.7
  patience: 3

  # scheduler_type: "cosine"
  # T_max: 300
  # eta_min: 1.0e-6

###################
## Train params
train_params:
  epochs: 200
  ckpt_path: "model_checkpoints/tfno_psiA_Re750.pt"
  load_ckpt: "model_checkpoints/tfno_psiA_Re750.pt" # Leave empty to start from scratch
  is_finetune: False

###################
## wandb params -- optional
wandb_params:
  wandb_dir: "model_checkpoints/logs_tfno_psiA_Re750"
  wandb_project: "MHD_PINO"
  wandb_group: "MHD_FNO3d"
  wandb_num_plots: 2
  wandb_plot_freq: 5

  plot_energy_spectra: False     # Enable energy spectra plotting
