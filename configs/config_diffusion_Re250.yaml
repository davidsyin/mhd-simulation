config_type: "diffusion"

####################
## Model options
model_params:
  model_type: "elucidated"  # "elucidated" or "unet"
  
  # UNet parameters
  base_dim: 128
  dim_mults: [1, 2, 3, 5, 8, 12]
  channels: 3  # Updated to match the number of selected channels [0, 2]
  self_condition: True
  learned_variance: False
  learned_sinusoidal_cond: False
  random_fourier_features: False
  sinusoidal_pos_emb_theta: 10000
  learned_sinusoidal_dim: 16
  dropout: 0.0
  
  # Attention parameters
  attn_heads: 8  # Can be a list for different layers
  attn_dim_head: 64  # Can be a list for different layers
  flash_attn: True
  
  # ElucidatedDiffusion parameters
  image_size: 128
  num_sample_steps: 256
  sigma_min: 0.002
  sigma_max: 80
  sigma_data: 0.5
  rho: 7
  P_mean: -1.2
  P_std: 1.2
  S_churn: 80
  S_tmin: 0.05
  S_tmax: 50
  S_noise: 1.003

###################
## Normalization options at dataset level
normalization_params:
  type: "minmax"
  feature_range: [-1, 1]
  inputs_stats_file: "/u/skacmaz/NODs/stats/train_only_diffusion_inputs_stats_Re250.npz"
  targets_stats_file: "/u/skacmaz/NODs/stats/train_only_diffusion_targets_stats_Re250.npz"

###################
## Dataset options
dataset_params:
  train_path: "/projects/begd/skacmaz/NODs_diffusion_data/Re250/train.npy"
  val_path: "/projects/begd/skacmaz/NODs_diffusion_data/Re250/val.npy"
  test_path: "/projects/begd/skacmaz/NODs_diffusion_data/Re250/test.npy"
  # channel_indices: 2    # Can be a list of channel indices

###################
## Dataloader options
train_loader_params:
  batch_size: 64
  shuffle: True
  num_workers: 1
  pin_memory: True

###################
## Optimizer options
optimizer_params:
  optimizer_type: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

  use_scheduler: True
  scheduler_type: "cosine"
  T_max: 1000
  eta_min: 5.0e-5

###################
## Training params
train_params:
  epochs: 1000
  ckpt_path: "/projects/begd/skacmaz/NODs_diffusion_checkpoints/diffusion_Re250.pt"
  load_ckpt: ""  # Leave empty to start from scratch
  is_finetune: False
  val_interval: 10
  sample_interval: 100
  clip_grad: True
  clip_grad_max_norm: 1.0
  norm_torchvision: True
  denorm_enhanced_vis: True

###################
## Log params
log_dir: "/u/skacmaz/NODs/logs/diffusion_Re250/"

###################
## wandb params -- optional (for consistency with neural operator config)
wandb_params:
  wandb_dir: "/u/skacmaz/NODs/logs/diffusion_Re250/"
  wandb_project: "NODs_Diffusion"
  wandb_group: "Re250"
  wandb_num_plots: 1
  wandb_plot_freq: 50
