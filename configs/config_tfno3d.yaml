####################
## Model options
model_params:
  model_type: "tfno"
  # model_variant: "time_evolution" # optional
  width: 8 # hidden_channels in TFNO3d
  n_layers: 4 # n_layers in TFNO3d
  modes1: 8 # x dimension modes
  modes2: 8 # y dimension modes
  modes3: 8 # t dimension modes
  fc_dim: 128 # For lifting_channels and projection_channels
  in_dim: 3 # u_x, u_y, A
  out_dim: 3 # u_x, u_y, A
  activation: "gelu"
  pad_x: 0.10 # 10% padding in x direction
  pad_y: 0.10 # 10% padding in y direction
  pad_z: 0.00 # no padding in t direction
  rank: 1.00 # Tensor factorization rank for Tucker
  factorization: "tucker"

###################
## Normalization options at dataset level
normalization_params:
  # type: "physics"
  # input_norm: [1.0, 1.0, 2.5e-4]
  # output_norm: [1.0, 1.0, 2.5e-4]
  stats_file: "/u/skacmaz/NODs/stats/train_only_stats.npz"

  # type: "minmax"
  # feature_range: [0, 1]

  type: "standard"
  # # mean: [0.0, 0.0, 0.0] # Uncomment if you want to use your own stats
  # # std: [1.13536170e-01, 1.04062743e-01, 6.62853878e-05] # Uncomment if you want to use your own stats

###################
## Dataset options
dataset_params:
  data_dir: "/work/hdd/begd/skacmaz/NODs_mhd_data_Re100/"
  data_file: "mhd_data_3channel_Re100.npy"
  name: "MHD_TFNO3d"
  num: 1000
  num_train: 950
  num_test: 50
  seed: 42

###################
## Loss options
loss_params:
  type: "mse"
  reduction: "mean"

# # Or a more complex example:
# loss_params:
#   type: "weighted_mse"
#   weights: [1.0, 2.0, 0.5]  # Higher weight on second component
#   reduction: "mean"
#
# # Physics-informed example:
# loss_params:
#   type: "physics_informed"
#   data_loss_type: "mse"
#   data_loss_weight: 1.0
#   physics_loss_weight: 0.5

###################
## Dataloader options
train_loader_params:
  batch_size: 1
  shuffle: True
  num_workers: 1
  pin_memory: True

val_loader_params:
  batch_size: 1
  shuffle: False
  num_workers: 1
  pin_memory: True

test_loader_params:
  batch_size: 1
  shuffle: False
  num_workers: 1
  pin_memory: True

###################
## Optimizer options
optimizer_params:
  optimizer_type: "adamw" # options: adam, adamw, sgd, lbfgs, lion, radam, adabelief, etc.
  lr: 1.0e-3
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]

  use_scheduler: True
  scheduler_type: "reducelr" # options: multistep, cosine, reducelr, dummy
  mode: "min"
  factor: 0.5
  patience: 10

  # scheduler_type: "cosine"
  # T_max: 300
  # eta_min: 1.0e-6

###################
## Train params
train_params:
  epochs: 300
  ckpt_freq: 50
  ckpt_path: "checkpoints/MHD_TFNO3d/model"
  load_ckpt: "" # Leave empty to start from scratch

###################
## wandb params -- optional
wandb_params:
  wandb_dir: "/u/skacmaz/NODs/logs"
  wandb_project: "MHD_PINO"
  wandb_group: "MHD_TFNO3d"
  wandb_num_plots: 2
  wandb_plot_freq: 5
