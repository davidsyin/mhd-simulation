optimizer_params:
  betas: [0.9, 0.999]
  lr: 1.0e-3
  use_scheduler: true
  scheduler_type: "reducelr" # options: multistep, cosine, reducelr, dummy
  mode: "min"
  factor: 0.5
  patience: 10

  # Alternative for MultiStepLR:
  # scheduler_type: "multistep"
  # milestones: [50, 100, 150, 200, 225]
  # gamma: 0.5

  # Alternative for CosineAnnealingLR:
  # scheduler_type: "cosine"
  # T_max: 300
  # eta_min: 1.0e-6
